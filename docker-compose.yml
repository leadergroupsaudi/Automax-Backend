x-minio-common: &minio-common
  image: quay.io/minio/minio:latest
  command: server --console-address ":9090" /mnt/data
  ports:
    - "9000:9000"
    - "9090:9090"
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
    interval: 30s
    timeout: 20s
    retries: 3

services:
  db:
    image: postgres:15
    restart: always
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U automax"], interval: 10s, timeout: 5s, retries: 5 }
    volumes:
      - automax_db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-automax}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-automax123}
      POSTGRES_DB: ${DB_NAME:-automax}

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4223:4222"
      - "8223:8222"

  redis:
    image: redis:7-alpine
    restart: always
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 5 }
    volumes:
      - automax_redis:/data
    ports:
      - "6379:6379"

  minio:
    <<: *minio-common
    hostname: minio
    restart: always
    volumes:
      - automax_minio:/mnt/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}

  backend:
    image: yashplg/automax31-backend:latest
    container_name: automax-backend
    restart: always
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      SERVER_PORT: 8080
      SERVER_HOST: 0.0.0.0
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio:9000
      NATS_URL: nats://nats:4222
      REGISTRY_BASE_URL: http://host.docker.internal:8082
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started

  # frontend:
  #   image: yashplg/automax31-frontend:latest
  #   container_name: automax-frontend
  #   restart: always
  #   ports:
  #     - "3000:3000"
  #   env_file:
  #     - .env
  #   depends_on:
  #     - backend

volumes:
  automax_db:
  automax_redis:
  automax_minio:
